services:
  db:
    image: postgres:16-alpine
    container_name: nexam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexam}
      POSTGRES_USER: ${POSTGRES_USER:-nexam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexam_secret_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexam_user} -d ${POSTGRES_DB:-nexam}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: nexam-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-nexam_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-nexam_minio_secret_password_2026}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pg_data:
    name: nexam_pg_data
  minio_data:
    name: nexam_minio_data

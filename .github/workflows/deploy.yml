name: Auto Deploy to VPS (Self-Hosted)

on:
  push:
    branches:
      - experiment
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Local VPS
    runs-on: self-hosted
    steps:
      - name: Deploy Application
        run: |
          cd ~/nexam
          echo "=== Menarik perubahan terbaru dari git ==="
          git fetch origin experiment
          git checkout experiment
          git pull origin experiment

          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh
